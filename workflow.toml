schema_version = 1
project = "gotth-jobs"
profile = "strict"
active = "reusable-v0-admission"

[settings]
worktree_root = "worktrees"
workflow_root = "workflow"
default_branch = "main"

[toolchain]
build = "go build ./..."
test = "go test -mod=readonly -race -cover ./..."
lint = "go vet -mod=readonly ./..."
format = "gofmt -w"
coverage = "go test -mod=readonly -coverprofile=coverage.out ./..."

[coverage]
map = "workflow/COVERAGE.md"
profile = "strict"
block_unresolved_high_risk = true
exception_expiry_days = 14

[feature.reusable-v0-admission]
id = "reusable-v0-admission"
slug = "reusable-v0-admission"
name = "Admit the reusable durable PostgreSQL job library"
namespace = "jobs"
parent = ""
state = "active"
risk = "critical"
assurance = "traceable-tests"
created_at = "2026-09-03T13:57:36Z"
activated_at = "2026-09-03T13:57:36Z"
updated_at = "2026-09-06T12:23:22Z"
folder = "workflow/features/reusable-v0-admission"
source_path = "pkg/jobs"
worktree = "/home/linus/.openclaw/workspace/.artifacts/worktrees/gotth-jobs-reusable"
branch = "feature/reusable-v0-admission"
scope = ["Durable PostgreSQL 17 job envelopes", "Atomic enqueue", "Lease fencing", "Heartbeats", "Bounded retries", "Cancellation", "Dead-letter operations", "Serial worker", "MIT licensing"]
non_goals = ["Exactly-once external side effects", "Cron scheduling or workflow DAGs", "Product event policy", "Automatic migrations or retention", "Databases other than PostgreSQL 17"]
affected_files = ["**"]
invariants = ["All work is at least once", "Unknown commit outcomes are never retried and returned handles are reconciliation-only", "Stale leases cannot mutate job state", "Payload meaning and authorization remain consumer-owned", "No live database or deployment is mutated"]
acceptance = ["All requirements trace to code, tests, and evidence", "Format, vet, race, repeated race, coverage, fuzz, PostgreSQL 17, clean-clone, performance, graph, and two Judge gates pass"]

[feature.reusable-v0-admission.rollback]
strategy = "delete_unpublished_repository_implementation"
notes = "No tag or consumer pin exists; revert the feature commits and retain the prior placeholder"
data_loss_risk = false
requires_migration_down = false

[[feature.reusable-v0-admission.interface]]
name = "Go library API"
kind = "api"
stability = "unstable-unreleased"
change = "new"

[[feature.reusable-v0-admission.interface]]
name = "PostgreSQL schema"
kind = "database"
stability = "unstable-unreleased"
change = "new"

[[feature.reusable-v0-admission.verification]]
id = "local"
kind = "unit"
command = "make verify"
required = true
timeout_seconds = 1200
side_effect = "local_write"
network = false
retries = 0

[[feature.reusable-v0-admission.verification]]
id = "postgresql-17"
kind = "integration"
command = "make verify-integration"
required = true
timeout_seconds = 1200
side_effect = "local_write"
network = false
retries = 0
